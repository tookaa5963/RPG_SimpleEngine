<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <title>CAMINO de LEYENDA</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #111;
      color: #fff;
      font-family: monospace, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #title-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #opening-video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background-color: #000;
      display: none;
    }

    #title-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      display: none;
      justify-content: center;
      align-items: center;
    }

    #title-stage {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      max-height: 100vh;
      max-width: 177.78vh;
      background-image: url('snapshot.jpg');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }

    #title-menu {
      position: absolute;
      top: 50%;
      left: 66%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 36px;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      z-index: 10001;
    }

    .title-btn {
      background: transparent;
      color: #bbb;
      border: none;
      font-size: 18px;
      font-family: monospace, sans-serif;
      padding: 4px 10px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.15s ease;
      text-align: left;
      min-width: auto;
      outline: none;
      text-shadow: 0 0 6px #000, 2px 2px 4px #000;
      display: flex;
      align-items: center;
    }

    .title-btn::before {
      content: '';
      display: inline-block;
      width: 22px;
      color: #ffd700;
    }

    .title-btn:hover::before,
    .title-btn.active::before {
      content: '▶';
    }

    .title-btn:hover,
    .title-btn.active {
      background: transparent;
      color: #fff;
      font-weight: bold;
      transform: scale(1.06);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 0 20px rgba(212, 175, 55, 0.7);
    }

    #slot-dialog {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.95);
      border: 4px solid #fff;
      border-radius: 8px;
      padding: 20px 24px;
      min-width: 580px;
      max-width: 92vw;
      max-height: 88vh;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
      z-index: 20000;
      display: none;
      box-sizing: border-box;
    }

    #slot-dialog h3 {
      margin-top: 0;
      margin-bottom: 8px;
      border-bottom: 2px solid #fff;
      padding-bottom: 8px;
      text-align: center;
      font-size: 20px;
      letter-spacing: 2px;
    }

    #slot-current-info {
      text-align: center;
      font-size: 14px;
      color: #0df;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    #slot-list {
      max-height: 52vh;
      overflow-y: auto;
      padding-right: 6px;
      margin-bottom: 8px;
    }

    #slot-list::-webkit-scrollbar {
      width: 8px;
    }

    #slot-list::-webkit-scrollbar-track {
      background: #111;
      border: 1px solid #444;
    }

    #slot-list::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 4px;
    }

    .slot-btn {
      width: 100%;
      margin-bottom: 6px;
      text-align: left;
      padding: 6px 12px;
      font-size: 15px;
      background: #000;
      border: 2px solid #666;
      border-radius: 4px;
      color: #fff;
      box-sizing: border-box;
      white-space: pre;
    }

    .slot-btn::before {
      content: none !important;
    }

    .slot-btn:hover,
    .slot-btn.active {
      background: #fff;
      color: #000;
      border-color: #fff;
      transform: scale(1.01);
      text-shadow: none;
    }

    .slot-btn.current-active {
      border-color: #0df;
      color: #0df;
    }

    .slot-btn.current-active:hover,
    .slot-btn.current-active.active {
      background: #0df;
      color: #000;
      border-color: #0df;
    }

    #slot-confirm-container {
      display: none;
      text-align: center;
      padding: 16px 0;
    }

    #slot-confirm-container p {
      font-size: 16px;
      margin: 0 0 20px 0;
      color: #f1c40f;
      line-height: 1.6;
      white-space: pre-line;
    }

    .confirm-btn-group {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .confirm-btn-group button {
      width: 140px;
      text-align: center;
    }

    body.title-mode #game-wrapper {
      display: none !important;
    }

    #game-wrapper {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      transform-origin: center center;
      flex-shrink: 0;
    }

    .sidebar {
      width: 220px;
      height: 768px;
      background-color: #000;
      border: 4px solid #fff;
      border-radius: 8px;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .sidebar h3 {
      margin-top: 0;
      border-bottom: 2px solid #fff;
      padding-bottom: 10px;
      text-align: center;
      font-size: 22px;
      letter-spacing: 2px;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar li {
      margin-bottom: 16px;
      font-size: 18px;
      display: flex;
      justify-content: space-between;
    }

    .meter-row {
      width: 100%;
      height: 7px;
      background-color: #222;
      border: 1px solid #555;
      border-radius: 3px;
      margin-top: -10px;
      margin-bottom: 14px;
      overflow: hidden;
      box-sizing: border-box;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      transition: width 0.25s ease, background-color 0.25s ease;
    }

    .hp-fill {
      background-color: #2ecc71;
    }

    .mp-fill {
      background-color: #3498db;
    }

    #ui-return-point-container {
      margin-top: auto;
      font-size: 14px;
      border-top: 1px solid #444;
      padding-top: 8px;
    }

    #ui-inventory {
      flex: 1;
      overflow-y: auto;
    }

    .controls-sidebar {
      margin-top: auto;
      font-size: 13px;
      color: #aaa;
      line-height: 1.5;
      border-top: 1px solid #444;
      padding-top: 8px;
    }

    .sound-controls {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .sound-toggle-btn {
      flex: 1;
      background: #222;
      color: #fff;
      border: 1px solid #666;
      border-radius: 4px;
      font-size: 11px;
      padding: 4px 2px;
      cursor: pointer;
      font-family: monospace;
      outline: none;
      transition: background 0.15s;
    }

    .sound-toggle-btn.off {
      color: #888;
      border-color: #444;
      background: #111;
    }

    .sound-toggle-btn:hover {
      border-color: #0df;
    }

    #game-container {
      position: relative;
      text-align: center;
    }

    canvas {
      border: 2px solid #555;
      background-color: #222;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .equip-text {
      font-size: 14px;
      color: #0df;
      text-align: right;
      display: block;
      margin-top: -10px;
      margin-bottom: 12px;
    }
  </style>
</head>

<body class="title-mode">

  <div id="title-overlay">
    <video id="opening-video" playsinline muted></video>
    <div id="title-screen">
      <div id="title-stage">
        <div id="title-menu">
          <button id="btn-new-game" class="title-btn active" tabindex="-1">New Game</button>
          <button id="btn-load-game" class="title-btn" tabindex="-1">Load Game</button>
        </div>
        <div id="theater-menu" style="display: none; position: absolute; top: 50%; left: 66%; transform: translateY(-50%); flex-direction: column; gap: 36px; background: transparent; z-index: 10002;">
          <button id="btn-theater-fall" class="title-btn active" tabindex="-1">黒竜討伐</button>
          <button id="btn-theater-ending" class="title-btn" tabindex="-1">エンディング</button>
          <button id="btn-theater-back" class="title-btn" tabindex="-1">戻る</button>
        </div>
      </div>
    </div>
  </div>

  <div id="cutscene-overlay"
    style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000; z-index: 25000; justify-content: center; align-items: center;">
    <video id="cutscene-video" playsinline
      style="width: 100vw; height: 100vh; object-fit: contain; background-color: #000;"></video>
  </div>

<div id="slot-dialog">
    <h3 id="slot-dialog-title">冒険の書</h3>
    <div id="slot-current-info"></div>
    
    <!-- ★追加: バックアップ入出力コンテナ -->
    <div id="slot-backup-container" style="display: flex; gap: 10px; margin-bottom: 12px; justify-content: center;">
      <button id="btn-export-save" class="title-btn slot-btn" style="width: auto; text-align: center; margin-bottom: 0;" tabindex="-1">バックアップ出力</button>
      <button id="btn-import-save" class="title-btn slot-btn" style="width: auto; text-align: center; margin-bottom: 0;" tabindex="-1">バックアップ読込</button>
      <input type="file" id="file-import-save" style="display: none;" accept=".json">
    </div>

    <div id="slot-list"></div>

    <div id="slot-confirm-container">
      <p id="slot-confirm-text">前の記録を消しますか？</p>
      <div class="confirm-btn-group">
        <button id="btn-confirm-yes" class="title-btn slot-btn" tabindex="-1">はい</button>
        <button id="btn-confirm-no" class="title-btn slot-btn active" tabindex="-1">いいえ</button>
      </div>
    </div>

    <button id="btn-slot-cancel" class="title-btn slot-btn" tabindex="-1"
      style="text-align: center; margin-top: 4px;">戻る</button>
  </div>

  <div id="game-wrapper">
    <div id="left-sidebar" class="sidebar">
      <h3 id="ui-label-status">ステータス</h3>
      <ul>
        <li><span>LV</span> <span id="ui-lv">-</span></li>

        <li><span>HP</span> <span id="ui-hp">- / -</span></li>
        <div class="meter-row">
          <div id="ui-hp-bar" class="meter-fill hp-fill"></div>
        </div>

        <li><span>MP</span> <span id="ui-mp">- / -</span></li>
        <div class="meter-row">
          <div id="ui-mp-bar" class="meter-fill mp-fill"></div>
        </div>

        <li><span>ATK</span> <span id="ui-atk">-</span></li>
        <li><span>DEF</span> <span id="ui-def">-</span></li>
        <li><span>SPD</span> <span id="ui-spd">-</span></li>

        <li id="ui-label-equip" style="margin-top: 24px; font-size: 14px; color: #aaa; border-bottom: 1px solid #444;">
          装備</li>
        <span class="equip-text" id="ui-wpn">なし</span>
        <span class="equip-text" id="ui-arm">なし</span>
        <span class="equip-text" id="ui-sld">なし</span>

        <li style="margin-top: 24px;"><span>EXP</span> <span id="ui-exp">-</span></li>
        <li><span>GOLD</span> <span id="ui-gold">-</span></li>
      </ul>

      <div id="ui-return-point-container">
        <span id="ui-label-return-point" style="color: #aaa; display: block; margin-bottom: 4px;">帰還地</span>
        <span id="ui-return-point-name"
          style="color: #0df; display: block; text-align: right; font-size: 14px;">-</span>
      </div>
    </div>

    <div id="game-container">
      <canvas id="gameCanvas" width="768" height="768"></canvas>
    </div>

    <div id="right-sidebar" class="sidebar">
      <h3 id="ui-label-items">道具</h3>
      <ul id="ui-inventory"></ul>

      <div class="controls-sidebar">
        <div id="ui-controls-text">
          【操作方法】<br>
          移動: 矢印 / WASD<br>
          決定: Space / Enter<br>
          取消: X / ESC<br>
          BGM: M / SE: N
        </div>
        <div class="sound-controls">
          <button id="btn-toggle-bgm" class="sound-toggle-btn" tabindex="-1">BGM: ON</button>
          <button id="btn-toggle-se" class="sound-toggle-btn" tabindex="-1">SE: ON</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function adjustGameScale() {
      const wrapper = document.getElementById('game-wrapper');
      if (!wrapper) return;

      const clientWidth = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
      const clientHeight = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;

      if (!clientWidth || !clientHeight || clientWidth < 100 || clientHeight < 100) {
        requestAnimationFrame(adjustGameScale);
        return;
      }

      const baseWidth = 1248;
      const baseHeight = 768;
      const scale = Math.min(clientWidth / baseWidth, clientHeight / baseHeight);

      if (Number.isFinite(scale) && scale > 0) {
        wrapper.style.transform = `scale(${scale})`;
      } else {
        requestAnimationFrame(adjustGameScale);
      }
    }

    window.addEventListener('resize', adjustGameScale);
    window.addEventListener('DOMContentLoaded', adjustGameScale);
    window.addEventListener('load', adjustGameScale);

    if (window.ResizeObserver) {
      const observer = new ResizeObserver(() => {
        adjustGameScale();
      });
      observer.observe(document.documentElement);
    }

    adjustGameScale();
  </script>
  <script type="module" src="js/main.js"></script>
</body>

</html>
